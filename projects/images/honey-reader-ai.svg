<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740"><rect width="360" height="740" rx="36" fill="#fdf6e3"/><text x="28" y="66" font-family="sans-serif" font-size="22" font-weight="700" fill="#586e75">Customize with AI</text><text x="28" y="110" font-family="sans-serif" font-size="13" fill="#93a1a1">1. What do you want?</text><rect x="24" y="122" width="312" height="90" rx="16" fill="#eee8d5"/><text x="40" y="150" font-family="sans-serif" font-size="13" fill="#657b83">Warm cream background,</text><text x="40" y="170" font-family="sans-serif" font-size="13" fill="#657b83">brown text, bigger margins</text><rect x="24" y="224" width="312" height="40" rx="20" fill="#b58900"/><text x="180" y="249" font-family="sans-serif" font-size="14" fill="#fdf6e3" text-anchor="middle">Copy prompt for your AI</text><text x="28" y="302" font-family="sans-serif" font-size="13" fill="#93a1a1">2. Paste the AI reply</text><rect x="24" y="314" width="312" height="90" rx="16" fill="#eee8d5"/><g fill="#93a1a1"><rect x="40" y="334" width="160" height="9" rx="4"/><rect x="52" y="354" width="200" height="9" rx="4"/><rect x="52" y="374" width="170" height="9" rx="4"/></g><text x="28" y="442" font-family="sans-serif" font-size="13" fill="#93a1a1">3. Preview</text><rect x="24" y="454" width="312" height="150" rx="16" fill="#f5ecd3" stroke="#d6c7a1"/><g fill="#8a5a2b"><rect x="56" y="482" width="180" height="12" rx="6"/><rect x="56" y="508" width="248" height="8" rx="4"/><rect x="56" y="524" width="230" height="8" rx="4"/><rect x="56" y="540" width="248" height="8" rx="4"/><rect x="56" y="556" width="160" height="8" rx="4"/></g><rect x="24" y="640" width="150" height="44" rx="22" fill="#eee8d5"/><text x="99" y="667" font-family="sans-serif" font-size="14" fill="#586e75" text-anchor="middle">Undo</text><rect x="186" y="640" width="150" height="44" rx="22" fill="#859900"/><text x="261" y="667" font-family="sans-serif" font-size="14" fill="#fdf6e3" text-anchor="middle">Apply</text></svg>
